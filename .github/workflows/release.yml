name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"

      - name: Generate Windows resources
        shell: pwsh
        run: |
          Remove-Item rsrc.syso, rsrc_windows_*.syso -Force -ErrorAction SilentlyContinue
          go run github.com/tc-hib/go-winres@latest simply `
            --icon app.ico `
            --manifest gui `
            --product-name "Quick Anydesk Connect" `
            --file-description "Tray helper for fast AnyDesk remote connections" `
            --original-filename "QuickAnydeskConnect.exe"

      - name: Build
        run: go build -trimpath -ldflags="-s -w -H windowsgui" -o QuickAnydeskConnect.exe .

      - name: Attach executable to release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"

          gh release view $tag --repo "${{ github.repository }}" *> $null
          if ($LASTEXITCODE -eq 0) {
            # A release created in the GitHub UI already has its release notes.
            # Keep the existing body unchanged and only attach/replace the EXE.
            gh release upload $tag QuickAnydeskConnect.exe `
              --repo "${{ github.repository }}" `
              --clobber
          }
          else {
            # Support the alternative workflow where only a tag is pushed.
            gh release create $tag QuickAnydeskConnect.exe `
              --repo "${{ github.repository }}" `
              --generate-notes `
              --title $tag
          }
