name: Release

on:
  push:
    tags:
      - "v*"
    branches:
      - "release/v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve release tag
        id: release_tag
        shell: pwsh
        run: |
          if ("${{ github.ref_type }}" -eq "tag") {
            $tag = "${{ github.ref_name }}"
          }
          else {
            $branch = "${{ github.ref_name }}"
            if (-not $branch.StartsWith("release/v")) {
              throw "Invalid release branch: $branch"
            }
            $tag = $branch.Substring("release/".Length)
          }

          if ($tag -notmatch '^v\d+\.\d+\.\d+$') {
            throw "Invalid release tag: $tag"
          }

          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Create tag for release branch
        if: github.ref_type == 'branch'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release_tag.outputs.tag }}
        run: |
          git fetch --tags --force
          git rev-parse "refs/tags/$env:RELEASE_TAG" *> $null
          if ($LASTEXITCODE -eq 0) {
            throw "Tag $env:RELEASE_TAG already exists. Use a new release version."
          }

          git tag $env:RELEASE_TAG "${{ github.sha }}"
          git push origin $env:RELEASE_TAG

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"

      - name: Generate Windows resources
        shell: pwsh
        run: |
          Remove-Item rsrc.syso, rsrc_windows_*.syso -Force -ErrorAction SilentlyContinue
          go run github.com/tc-hib/go-winres@latest simply `
            --icon app.ico `
            --manifest gui `
            --product-name "Quick Anydesk Connect" `
            --file-description "Tray helper for fast AnyDesk remote connections" `
            --original-filename "QuickAnydeskConnect.exe"

      - name: Build
        run: go build -trimpath -ldflags="-s -w -H windowsgui" -o QuickAnydeskConnect.exe .

      - name: Create SHA-256 file
        shell: pwsh
        run: |
          $hash = (Get-FileHash QuickAnydeskConnect.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  QuickAnydeskConnect.exe" | Set-Content -Encoding ascii QuickAnydeskConnect.exe.sha256

      - name: Attach executable to release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release_tag.outputs.tag }}
        run: |
          gh release view $env:RELEASE_TAG --repo "${{ github.repository }}" *> $null
          if ($LASTEXITCODE -eq 0) {
            # A release created in the GitHub UI already has its release notes.
            # Keep the existing body unchanged and only attach/replace assets.
            gh release upload $env:RELEASE_TAG QuickAnydeskConnect.exe QuickAnydeskConnect.exe.sha256 `
              --repo "${{ github.repository }}" `
              --clobber
          }
          else {
            gh release create $env:RELEASE_TAG QuickAnydeskConnect.exe QuickAnydeskConnect.exe.sha256 `
              --repo "${{ github.repository }}" `
              --generate-notes `
              --title $env:RELEASE_TAG
          }
